<script>
document.addEventListener('DOMContentLoaded', function() {
  const sidebar = document.getElementById('quarto-sidebar');
  if (sidebar) {
    const footer = document.createElement('div');
    footer.className = 'sidebar-footer';
    footer.innerHTML = '<strong>Data Stewards\' Team</strong><br>Library & Information Services<br>Reporting year 2025 – 2026';
    sidebar.appendChild(footer);
  }
});
</script>
<script>
function updateFilterBarTop() {
  var h = document.getElementById('quarto-header');
  var top = h ? Math.max(0, h.getBoundingClientRect().bottom) : 0;
  document.documentElement.style.setProperty('--filter-bar-top', top + 'px');
}
window.addEventListener('scroll', updateFilterBarTop, { passive: true });
window.addEventListener('resize', updateFilterBarTop);
updateFilterBarTop();
</script>
