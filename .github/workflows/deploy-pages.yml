name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        run: pipenv install
      - name: Render site
        run: pipenv run quarto render

  deploy-production:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://tue-datastewards.github.io/rdm-dash/
    steps:
      - name: Deploy to GitHub Pages
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site/
          action: deploy
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          deploy-commit-message: Deploy production build
          comment: false